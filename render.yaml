services:
  - type: web
    name: driving-test-app
    runtime: docker
    # Paid plan required — persistent disks (below) aren't available on the free tier.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      # Lives on the persistent disk above — survives deploys/restarts, unlike the container's
      # own ephemeral filesystem. See docker/entrypoint.sh for how this is consumed.
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # Object storage — Cloudflare R2 (S3-compatible) recommended, see docs/ROADMAP.md Phase 3.
      # Fill in real bucket credentials in the Render dashboard; nothing here is committed.
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      # Real transactional email via SMTP — works with Resend/Postmark/Mailgun/SES's SMTP
      # endpoints without any new dependency (see config/mail.php's "smtp" mailer). Fill in real
      # credentials in the Render dashboard; without them, verification/reset/invite emails go
      # nowhere (MAIL_MAILER currently defaults to "log" — written to a log file, never sent).
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # Explicit allow-list instead of a CORS wildcard — see config/cors.php.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_CHANNEL
        value: stderr
