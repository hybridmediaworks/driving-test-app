; Application PHP overrides — loaded for every SAPI, including the `php artisan serve` CLI runtime
; the container uses. The stock php:8.3-cli image caps upload_max_filesize at 2M, so designer image
; uploads between 2 MB and the app's 8 MB limit failed with "The image failed to upload." nginx
; already allows 20m; PHP now sits comfortably above the 8 MB validation cap, with headroom for the
; multipart overhead and enough memory to fit/crop large source images.
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 512M
max_execution_time = 120
