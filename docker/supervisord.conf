[supervisord]
nodaemon=true
user=root

[program:laravel]
directory=/var/www/apps/api
command=php artisan serve --host=127.0.0.1 --port=8001
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nextjs]
directory=/var/www
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production"
command=node apps/web/server.js
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
directory=/var/www/apps/api
command=php artisan queue:work --tries=3 --backoff=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
directory=/var/www/apps/api
command=php artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# One-shot at every container start. The disposable-email lists are otherwise only refreshed by the
# nightly schedule (02:00/02:15 UTC), so a fresh deploy had an empty mail-server list until then and
# brand-new rotating temp-mail domains slipped through signup. Failures are non-fatal (offline start).
[program:disposable-lists]
directory=/var/www/apps/api
command=sh -c "php artisan disposable:update; php artisan disposable:update-mail-servers"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
