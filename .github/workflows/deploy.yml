name: Deploy to EC2

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scp-action only adds/overwrites files — it never deletes ones removed from the repo,
      # so a file deleted in git (e.g. a renamed page) would otherwise sit stale on the server
      # forever and still get picked up by Docker's `COPY . .`. Wiping first guarantees the
      # server always exactly mirrors the pushed commit. production.env lives outside this
      # directory (/home/ubuntu/production.env) specifically so this is safe to nuke.
      - name: Clean target directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf /home/ubuntu/driving-test-app
            mkdir -p /home/ubuntu/driving-test-app

      - name: Copy repo to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/driving-test-app"
          strip_components: 0

      - name: Build image and restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # The action kills the session after 10 minutes by default, which is under what a
          # cold build costs on a 2-vCPU box — it died mid-way through compiling the PHP
          # extensions and reported "Run Command Timeout", looking like a build failure.
          command_timeout: 40m
          script: |
            set -e
            cd /home/ubuntu/driving-test-app

            # Only clear the build cache when the disk is actually tight. Wiping it on every deploy
            # (which this did, on the old 8GB box, to survive ENOSPC during `pnpm install`) means
            # every build starts from zero — PHP extensions recompiled, pnpm re-installed, Next
            # rebuilt — so a one-line change costs the same ~10 minutes as a rewrite. With room on
            # the volume the cache is what makes a small deploy small.
            #
            # MySQL runs as its own container on the `dt` network and must survive this: dangling
            # images and stopped containers only, never `docker system prune`, never `-a` while the
            # mysql image is in use.
            df -h /
            sudo docker container prune -f
            sudo docker image prune -f

            AVAIL_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
            if [ "$AVAIL_GB" -lt 10 ]; then
              echo "Only ${AVAIL_GB}G free — clearing the build cache."
              sudo docker image prune -af
              sudo docker builder prune -af
            else
              echo "${AVAIL_GB}G free — keeping the build cache."
            fi
            df -h /

            sudo docker build -t driving-test-app:latest .
            sudo docker stop driving-test-app || true
            sudo docker rm driving-test-app || true
            sudo docker run -d --name driving-test-app --restart unless-stopped \
              --network dt \
              -p 80:10000 --env-file /home/ubuntu/production.env driving-test-app:latest
            sudo docker image prune -f
